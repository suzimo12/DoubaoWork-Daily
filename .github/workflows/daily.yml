# 覆盖到你的豆包仓库： .github/workflows/daily.yml
# 相对上游 L0NE-6/DoubaoWork-Daily 的 daily.yml，改了三处：
#   1. 取消 schedule 注释（北京时间 09:15 触发）
#   2. permissions: read -> write（心跳需要提交权限）
#   3. 末尾新增 Heartbeat step，避免仓库 60 天无活动被 GitHub 停用定时

name: Doubao Work Daily
on:
  schedule:
    - cron: "15 1 * * *"  # UTC 01:15 = 北京时间 09:15
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: doubaowork-daily
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore Doubao Work check-in ledger
        uses: actions/cache/restore@v4
        with:
          path: doubaowork_state.json
          key: doubaowork-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            doubaowork-state-
      - run: pip install requests
      - name: Run Doubao Work Daily
        env:
          DOUBAOWORK_COOKIES: ${{ secrets.DOUBAOWORK_COOKIES }}
          DOUBAOWORK_COOKIE: ${{ secrets.DOUBAOWORK_COOKIE }}
          DOUBAOWORK_DEVICE_ID: ${{ secrets.DOUBAOWORK_DEVICE_ID }}
          DOUBAOWORK_WEB_ID: ${{ secrets.DOUBAOWORK_WEB_ID }}
          DOUBAOWORK_FINGERPRINT: ${{ secrets.DOUBAOWORK_FINGERPRINT }}
          DOUBAOWORK_PROXY: ${{ secrets.DOUBAOWORK_PROXY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          BARK_URL: ${{ secrets.BARK_URL }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: python doubaowork_daily.py
      - name: Save Doubao Work check-in ledger
        if: always() && hashFiles('doubaowork_state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: doubaowork_state.json
          key: doubaowork-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Heartbeat (keep schedule alive)
        if: always()
        run: |
          date -u '+%Y-%m-%dT%H:%M:%SZ' >> heartbeat.log
          git config user.name "checkin-bot"
          git config user.email "checkin-bot@users.noreply.github.com"
          git add -f heartbeat.log
          git commit -m "chore: heartbeat [skip ci]" || true
          git push || true
